<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#fffdf9" />
<title>شجرہ نسب · Family Tree</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2326356a'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%23f1cf7e' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='9' y='2.5' width='6' height='5' rx='1.5'/%3E%3Crect x='2.5' y='16.5' width='6' height='5' rx='1.5'/%3E%3Crect x='15.5' y='16.5' width='6' height='5' rx='1.5'/%3E%3Cpath d='M12 7.5v5M5.5 16.5v-2a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="5" rx="1.5"/><rect x="2.5" y="16.5" width="6" height="5" rx="1.5"/><rect x="15.5" y="16.5" width="6" height="5" rx="1.5"/><path d="M12 7.5v5M5.5 16.5v-2a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v2"/></svg></span>
    <h1>شجرہ نسب</h1>
    <div class="brand-sub"><span class="en">Family Tree</span><span class="stats" id="stats"></span></div>
  </div>
  <div class="search" id="searchWrap">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search name…  /  نام تلاش کریں" dir="auto" autocomplete="off">
    <span class="count" id="searchCount"></span>
    <button class="clr" id="searchClr" title="Clear"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="menuwrap">
    <button class="menubtn" id="menuBtn" title="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="menu" id="menu">
      <div class="seg">
        <button id="mExpand"><svg class="i" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>Expand all</button>
        <button id="mCollapse"><svg class="i" viewBox="0 0 24 24"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg>Collapse all</button>
      </div>
      <div class="seg">
        <span class="grp">Save as</span>
        <button id="mPng" title="Save image (PNG)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>PNG<em>image</em></button>
        <button id="mPdfLandscape" title="Save PDF — horizontal"><svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/></svg>PDF ↔<em>horizontal</em></button>
        <button id="mPdfPortrait" title="Save PDF — vertical"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2"/></svg>PDF ↕<em>vertical</em></button>
      </div>
      <div class="seg">
        <button id="mPrint"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>Print</button>
      </div>
    </div>
  </div>
</header>

<div id="stage"><div id="world"><svg id="links"></svg></div></div>

<aside id="panel">
  <div class="p-head"><span>Details</span><button class="close" id="panelClose" title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="hero" id="roHero">
    <div class="avatar" id="roAvatar"></div>
    <div class="ro-name" id="roName"></div>
    <div class="ro-roman" id="roRoman"></div>
    <div class="ro-branch" id="roBranch"></div>
  </div>
  <div class="ro-rows" id="roRows"></div>
</aside>

<div class="legend" id="legend" hidden></div>

<div id="zoomdock">
  <button id="zoomOut" title="Zoom out"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <span class="lvl" id="zoomLvl">100%</span>
  <button id="zoomIn" title="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <span class="div"></span>
  <button class="lbl" id="fit" title="Fit to screen"><svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>Fit</button>
</div>

<script src="script.js"></script>
</body>
</html>
