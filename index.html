<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>شجرہ نسب · Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="brand"><h1>شجرہ نسب</h1><span class="stats" id="stats"></span></div>
  <div class="search" id="searchWrap">
    <input id="search" type="text" placeholder="Search name…  /  نام تلاش کریں" dir="auto" autocomplete="off">
    <span class="count" id="searchCount"></span>
    <button class="clr" id="searchClr" title="Clear">&times;</button>
  </div>
  <div class="menuwrap">
    <button class="menubtn" id="menuBtn" title="Menu">&#9776;</button>
    <div class="menu" id="menu">
      <button id="mExpand">Expand all</button>
      <button id="mCollapse">Collapse all</button>
      <div class="sep"></div>
      <span class="grp">Save as</span>
      <button id="mPng" title="Save image (PNG)">PNG</button>
      <button id="mPdfLandscape" title="Save PDF — horizontal">PDF ↔</button>
      <button id="mPdfPortrait" title="Save PDF — vertical">PDF ↕</button>
      <div class="sep"></div>
      <button id="mPrint">Print</button>
    </div>
  </div>
</header>

<div id="stage"><div id="world"><svg id="links"></svg></div></div>

<aside id="panel">
  <h2><span>Details</span><button class="close" id="panelClose">&times;</button></h2>
  <div class="ro-name" id="roName"></div>
  <div class="ro-roman" id="roRoman"></div>
  <div class="ro-rows" id="roRows"></div>
</aside>

<div id="zoomdock">
  <button id="zoomOut">&minus;</button>
  <span class="lvl" id="zoomLvl">100%</span>
  <button id="zoomIn">+</button>
  <button class="lbl" id="fit">Fit</button>
</div>

<script src="script.js"></script>
</body>
</html>
